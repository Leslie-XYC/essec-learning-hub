<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESSEC Guest Speaker Learning Hub</title>
<style>
:root{--navy:#0d204b;--pale:#edf2fb;--muted:#63718d;--line:#d8e1f0}*{box-sizing:border-box}body{margin:0;background:#f7f9fd;color:var(--navy);font-family:Inter,Arial,sans-serif;line-height:1.6}h1,h2,h3{font-family:Georgia,serif;line-height:1.16}button{cursor:pointer;font:inherit}header{background:white;border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:auto;padding:0 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}.logo{background:var(--navy);color:white;border-radius:9px;padding:7px 13px;font-family:Georgia,serif;font-weight:bold}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{background:none;border:0;color:var(--navy);font-weight:650;padding:8px 13px;border-radius:30px}.nav button.active{background:var(--navy);color:white}.hero{background:var(--navy);color:white;padding:65px 0}.eyebrow{color:#adc3ee;font-size:13px;letter-spacing:2px;font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(34px,5.5vw,58px);max-width:690px;margin:12px 0 22px}.hero p{max-width:620px;color:#d9e4fc;font-size:17px}.stats{display:flex;gap:50px;border-top:1px solid #354469;margin-top:35px;padding-top:20px;flex-wrap:wrap}.stats strong{display:block;font:700 27px Georgia,serif}.stats small{color:#b9c8e4}main{min-height:70vh}.section{padding:54px 0}.section h2{font-size:32px;margin:0 0 10px}.lede{color:var(--muted);margin-top:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px}.card,.panel{background:#fff;border:2px solid var(--line);border-radius:25px;padding:26px}.card{display:flex;flex-direction:column;min-height:290px}.card h3{font-size:24px;margin:16px 0 9px}.card p{color:#576681;flex:1}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:13px;color:var(--muted)}.number{display:inline-block;background:var(--navy);color:white;padding:5px 14px;border-radius:10px;font-weight:bold}.btn{border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:30px;padding:10px 20px;font-weight:750}.btn.secondary{background:#fff;color:var(--navy)}.btn:focus-visible,.choice:focus-visible{outline:3px solid #6b95e5;outline-offset:3px}.session-hero{margin:36px 0 26px;border-radius:30px;background:var(--navy);color:white;padding:34px 40px}.session-hero h1{font-size:43px;margin:8px 0}.session-hero p{color:#d5e2f6;max-width:900px}.back{color:var(--navy);border:0;background:none;font-weight:750;margin-top:20px}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}.panel h2{font-size:26px;margin:0 0 13px}.takeaway{padding:12px 0;border-bottom:1px solid var(--line)}.takeaway:last-child{border:0}.takeaway strong{display:block}.takeaway span{color:#52617d}.quiz{max-width:950px;margin:26px auto 60px}.quiz h2{font-size:32px}.progress{height:11px;background:#e2e9f7;border-radius:9px;overflow:hidden;margin:20px 0 30px}.progress>div{height:100%;background:var(--navy);transition:width .2s}.quiz-meta{display:flex;justify-content:space-between;color:#53637f;font-weight:700}.question{font:700 clamp(25px,3vw,36px) Georgia,serif;margin:30px 0}.choices{display:grid;gap:12px}.choice{display:flex;gap:15px;align-items:center;text-align:left;border:2px solid var(--line);background:white;border-radius:16px;padding:17px 20px;color:var(--navy);font-weight:550}.letter{background:var(--pale);padding:3px 11px;border-radius:8px;font-weight:800}.choice.correct{border-color:#20845d;background:#eaf8f0}.choice.wrong{border-color:#c74343;background:#fdf0f0}.choice:disabled{cursor:default}.feedback{margin:18px 0;padding:15px 18px;border-radius:13px;background:#eef3fc}.result{text-align:center;padding:24px 12px}.result strong{font:700 76px Georgia,serif;display:block}.result h2{margin:10px}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}.other{border-top:1px solid var(--line);margin-top:32px;padding-top:22px}footer{background:var(--navy);color:#cbd6ef;padding:22px 0;font-size:13px}.footer-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}@media(max-width:800px){.cards,.content-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;padding:15px 0}.hero{padding:42px 0}.session-hero{padding:28px 22px}.session-hero h1{font-size:35px}.stats{gap:26px}.section{padding:35px 0}}
</style></head><body><header><div class="wrap top"><div class="brand"><span class="logo">E</span>ESSEC Guest Speaker Learning Hub</div><nav class="nav" id="nav" aria-label="Main navigation"></nav></div></header><main id="app"></main><footer><div class="wrap footer-row"><span>ESSEC Guest Speaker Learning Hub</span><span>Based on Digital Platforms Test Drive &amp; LaunchLab slides · 9 October 2026</span></div></footer>
<script>
const sessions=[
  {
    "id": 1,
    "title": "Digital Marketing Tools & Platforms",
    "topic": "Session 1 · Digital Platforms Test Drive · 9 October 2026",
    "summary": "Understand the marketing technology landscape, how tools connect, and how AI changes digital marketing workflows.",
    "overview": "Digital marketing technologies help marketers coordinate customer experiences, design campaigns, personalize offers and measure results. This section compares point tools, platforms, suites, hubs and the newer layer of AI copilots and agents.",
    "takeaways": [
      [
        "Why marketing tools matter",
        "Marketers use technology to coordinate customer experiences across channels, personalize offers, create engaging content and measure campaign performance."
      ],
      [
        "Point tools vs platforms",
        "A point tool focuses on a particular function, while a platform supports a broader range of requirements within one or two marketing areas and exposes APIs for extensions."
      ],
      [
        "Suites vs hubs",
        "A suite combines several products from one provider with built-in integration. A hub centralizes access to applications and workflows, including collaboration, analytics, data integration and operations."
      ],
      [
        "Connected data for AI",
        "The slides highlight the importance of choosing technologies that can exchange clean data: AI-driven marketing is limited by the information its systems can access."
      ],
      [
        "AI copilots and agents",
        "Copilots help draft briefs, copy, visuals and reports; agents can plan and act across tools. Trade-offs include transparency, accuracy, brand safety, privacy and vendor dependence."
      ]
    ],
    "questions": [
      {
        "q": "Which type of marketing technology is designed for one clearly defined function?",
        "a": [
          "Hub",
          "Point tool",
          "Suite",
          "Media agency"
        ],
        "correct": 1,
        "why": "Point tools target a specific marketing function. Source: Digital Platforms Test Drive, slide 10."
      },
      {
        "q": "What makes a digital marketing platform different from a point tool?",
        "a": [
          "It supports broader requirements and can offer APIs for extensions",
          "It cannot connect to other systems",
          "It only sends emails",
          "It must contain products from several vendors"
        ],
        "correct": 0,
        "why": "Platforms address broader needs within one or two areas and offer programmatic APIs. Source: slide 11."
      },
      {
        "q": "What is a defining characteristic of a marketing suite?",
        "a": [
          "No integration between products",
          "Only one narrowly defined feature",
          "Multiple products from one provider offered together",
          "A portal limited to task management"
        ],
        "correct": 2,
        "why": "Suites combine several products from one provider with built-in integration. Source: slide 12."
      },
      {
        "q": "Which set of capabilities is associated with digital marketing hubs?",
        "a": [
          "Only video editing",
          "Collaboration, analytics, data integration and operations",
          "Only paid search",
          "Printing, payroll and logistics"
        ],
        "correct": 1,
        "why": "Those four capabilities define a digital marketing hub in the slides. Source: slide 13."
      },
      {
        "q": "According to the slides, which is a risk of AI copilots and agents?",
        "a": [
          "They always require paper reports",
          "They cannot help with content creation",
          "Less transparency and data privacy concerns",
          "They eliminate the need for connected data"
        ],
        "correct": 2,
        "why": "The presentation lists transparency, accuracy, brand safety, privacy and vendor lock-in as risks. Source: slide 14."
      }
    ]
  },
  {
    "id": 2,
    "title": "Media Buying & Social Advertising",
    "topic": "Session 2 · Digital Platforms Test Drive · 9 October 2026",
    "summary": "Compare unpaid and paid social media, then explore how TikTok, Meta, LinkedIn and YouTube tools support advertising.",
    "overview": "This section introduces the difference between organic and paid social media and shows why paid media matters for reach and targeted exposure. The slides also present platform advertising features and campaign examples. The media agency role is introduced as a topic, but not explored in depth in the provided slides.",
    "takeaways": [
      [
        "Organic social media",
        "Unpaid posts, videos and stories help build relationships, a brand voice and community engagement. Their reach depends on followers, sharing and platform algorithms."
      ],
      [
        "Paid social media",
        "Paid campaigns use ad budgets for targeted reach. Examples include boosted posts, sponsored collaborations, retargeting and creator partnership ads; results generally depend on continued spend."
      ],
      [
        "TikTok for Business",
        "Spark Ads boost existing creator posts; Symphony supports AI-made or translated video; Smart+ supports AI targeting, bids and creative selection."
      ],
      [
        "Meta and LinkedIn",
        "Meta Ads Manager includes Advantage+ and A/B testing. LinkedIn Campaign Manager targets professional attributes and offers Lead Gen Forms."
      ],
      [
        "YouTube and measurement",
        "YouTube Ads supports video placements and performance metrics. The slides emphasize analytics, testing and real-time optimization across platforms."
      ]
    ],
    "questions": [
      {
        "q": "What best describes organic social media?",
        "a": [
          "Unpaid content shared to engage people naturally",
          "Paid ads shown to a targeted audience",
          "Only influencer contracts",
          "Only search engine ads"
        ],
        "correct": 0,
        "why": "Organic social consists of unpaid posts, videos and other content. Source: Digital Platforms Test Drive, slide 34."
      },
      {
        "q": "What is an important limitation of paid social media?",
        "a": [
          "It cannot target specific audiences",
          "It always reaches everyone",
          "Results usually depend on continued advertising spend",
          "It prevents brands from measuring results"
        ],
        "correct": 2,
        "why": "The slides note that paid campaigns typically deliver results while they remain funded. Source: slide 36."
      },
      {
        "q": "Which TikTok feature amplifies a creator’s existing organic post?",
        "a": [
          "Peak Points",
          "Spark Ads",
          "Lead Gen Forms",
          "Advantage+ Campaign Budget"
        ],
        "correct": 1,
        "why": "Spark Ads boost organic TikTok creator posts. Source: slide 22."
      },
      {
        "q": "Which platform tool captures professional leads without requiring users to leave the platform?",
        "a": [
          "TikTok Symphony",
          "YouTube Peak Points",
          "X Promoted Posts",
          "LinkedIn Lead Gen Forms"
        ],
        "correct": 3,
        "why": "LinkedIn Lead Gen Forms collect leads within LinkedIn. Source: slide 27."
      },
      {
        "q": "Which activity is an example of paid social rather than organic social?",
        "a": [
          "Replying to comments",
          "Posting without boosting",
          "Running a retargeting ad campaign",
          "Sharing unpaid community content"
        ],
        "correct": 2,
        "why": "Retargeting campaigns are listed as paid social activities. Source: slides 35–37."
      }
    ]
  },
  {
    "id": 3,
    "title": "Guest Session — Vibe Coding & Website Deployment",
    "topic": "Session 3 · LaunchLab Guest Session · 9 October 2026",
    "summary": "Learn the practical AI-assisted workflow from a website idea to a live link, including Claude Design, GitHub, Vercel and backend basics.",
    "overview": "The LaunchLab guest session demonstrates how to design a front end using prompts, turn it into a working site, store its source code on GitHub and publish it with Vercel. It also explains HTML, CSS, JavaScript, version control, logins, tokens and Supabase.",
    "takeaways": [
      [
        "Prompt and design the front end",
        "Use a specific prompt that explains the role, goal, audience, pages, features, visual style and expected output. Claude Design creates the visual shell without requiring initial coding knowledge."
      ],
      [
        "Build from the design",
        "The slides describe handing the design to Claude Code to create a functional website. Their overall workflow is Design → Build → Deploy."
      ],
      [
        "Understand web files",
        "index.html contains content and structure; styles.css controls appearance; script.js contains interaction and button behavior."
      ],
      [
        "GitHub and Vercel",
        "A repository stores project files and their history. Commit saves a change snapshot, push sends local commits to GitHub, and Vercel hosts the website and can redeploy when connected code changes."
      ],
      [
        "Beyond a static website",
        "Persistent users and live data require additional services. The guest session introduces login tokens, authentication and Supabase as a backend service for user accounts and databases."
      ]
    ],
    "questions": [
      {
        "q": "In the LaunchLab workflow, what is Claude Design mainly used for?",
        "a": [
          "Managing advertising spend",
          "Creating the visual front end from prompts",
          "Storing user passwords",
          "Buying domain names"
        ],
        "correct": 1,
        "why": "Claude Design helps create the visual shell using a natural-language description. Source: Vibe Coding slides 4–6."
      },
      {
        "q": "Which file primarily controls what happens when someone clicks a button?",
        "a": [
          "README.md",
          "styles.css",
          "script.js",
          "index.html only"
        ],
        "correct": 2,
        "why": "The slides distinguish structure in index.html, styling in styles.css and behavior in script.js. Source: slide 24."
      },
      {
        "q": "What does GitHub “push” do?",
        "a": [
          "Uploads locally committed changes to GitHub",
          "Deletes the website",
          "Changes the website font",
          "Creates a user login token"
        ],
        "correct": 0,
        "why": "Push sends local commits to the remote repository. Source: slides 15–16."
      },
      {
        "q": "What is Vercel used for in the workshop?",
        "a": [
          "Social listening",
          "Editing classroom PDFs",
          "Storing a password in a public repository",
          "Publishing and hosting a website from a repository"
        ],
        "correct": 3,
        "why": "Vercel connects to a Git repository, deploys the site and provides a public link. Source: slides 19–21."
      },
      {
        "q": "Why might a website use a service such as Supabase?",
        "a": [
          "To create better headings only",
          "To add authentication and a database for users",
          "To replace every image with text",
          "To avoid any server-side data"
        ],
        "correct": 1,
        "why": "Supabase is introduced as a backend-as-a-service for authentication, verification and databases. Source: slides 26–28."
      }
    ]
  }
];
let current=0,index=0,score=0,selected=null,finished=false;const app=document.querySelector('#app'),nav=document.querySelector('#nav');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderNav(){nav.innerHTML=[['Home',0],...sessions.map(s=>['Session '+s.id,s.id])].map(([label,id])=>`<button class="${current===id?'active':''}" onclick="go(${id})">${label}</button>`).join('');}
function go(id){current=id;index=0;score=0;selected=null;finished=false;render();window.scrollTo(0,0);}
function home(){return `<div class="hero"><div class="wrap"><span class="eyebrow">Review · Remember · Reflect</span><h1>Welcome to the Guest Speaker Learning Hub</h1><p>Turn each session into lasting knowledge. Read the key takeaways, take a quick quiz, and see how much you remember.</p><button class="btn secondary" onclick="go(1)">Start Session 1 →</button><div class="stats"><div><strong>3</strong><small>Learning sessions</small></div><div><strong>15</strong><small>Published quiz questions</small></div><div><strong>Instant</strong><small>Answer feedback</small></div></div></div></div><div class="wrap section"><h2>Guest speaker sessions</h2><p class="lede">Choose a session to review the key ideas and test yourself.</p><div class="cards">${sessions.map(s=>`<article class="card"><div><span class="number">${s.id}</span><h3>${escapeHTML(s.title)}</h3><div class="small">${escapeHTML(s.topic)}</div><p>${escapeHTML(s.summary)}</p></div><div class="card-foot"><span class="small">${s.questions.length?s.questions.length+' questions':'Content pending'}</span><button class="btn" onclick="go(${s.id})">${s.questions.length?'Start learning':'View session'}</button></div></article>`).join('')}</div></div>`}
function sessionPage(s){return `<div class="wrap"><button class="back" onclick="go(0)">← All sessions</button><div class="session-hero"><div class="eyebrow">Session ${s.id}</div><h1>${escapeHTML(s.title)}</h1><div style="color:#adc3ee">${escapeHTML(s.topic)}</div><p>${escapeHTML(s.overview)}</p></div>${s.takeaways.length?`<div class="panel" style="margin-bottom:25px"><h2>Key learning points</h2><div class="content-grid">${s.takeaways.map(([t,d])=>`<div class="takeaway"><strong>${escapeHTML(t)}</strong><span>${escapeHTML(d)}</span></div>`).join('')}</div></div>`:''}${s.questions.length?quiz(s):`<section class="panel" style="margin-bottom:45px"><h2>Materials coming soon</h2><p>The session slides have not yet been provided. No quiz questions have been invented for this session.</p></section>`}</div>`}
function quiz(s){if(finished)return `<div class="panel quiz result"><div class="eyebrow">Your final score</div><strong>${score} / ${s.questions.length}</strong><h2>${score===s.questions.length?'Excellent work!':score>=3?'Great work!':'Keep practising!'}</h2><p>Review the key learning points and try again whenever you like.</p><div class="actions"><button class="btn" onclick="restart()">↻ Restart quiz</button><button class="btn secondary" onclick="go(0)">Back to homepage</button></div><div class="other">Try another session<div class="actions">${sessions.filter(x=>x.id!==s.id&&x.questions.length).map(x=>`<button class="btn secondary" onclick="go(${x.id})">Session ${x.id}</button>`).join('')}</div></div></div>`;let x=s.questions[index];return `<div class="panel quiz"><div class="quiz-meta"><span>Question ${index+1} of ${s.questions.length}</span><span>Score: ${score}</span></div><div class="progress"><div style="width:${index/s.questions.length*100}%"></div></div><div class="question">${escapeHTML(x.q)}</div><div class="choices">${x.a.map((a,i)=>`<button class="choice ${selected!==null?(i===x.correct?'correct':i===selected?'wrong':''):''}" onclick="answer(${i})" ${selected!==null?'disabled':''}><span class="letter">${'ABCD'[i]}</span>${escapeHTML(a)}</button>`).join('')}</div>${selected!==null?`<div class="feedback"><strong>${selected===x.correct?'Correct!':'Not quite.'}</strong> ${escapeHTML(x.why)}</div><button class="btn" onclick="next()">${index===s.questions.length-1?'See final score →':'Next question →'}</button>`:''}</div>`}
function answer(i){if(selected!==null)return;selected=i;if(i===sessions[current-1].questions[index].correct)score++;render();}
function next(){if(selected===null)return;if(index===sessions[current-1].questions.length-1)finished=true;else{index++;selected=null}render();}
function restart(){index=0;score=0;selected=null;finished=false;render();}
function render(){renderNav();app.innerHTML=current===0?home():sessionPage(sessions[current-1]);}render();
</script></body></html>
